<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Itens</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}"
                                 th:text="${item.quantidade + 'x ' + item.nomeProduto + ' (R$ ' + item.precoUnitario + ')'}"></div>
                        </td>
                        <td>
                            <div th:text="${'R$ ' + pedido.valorTotal}"></div>
                            <small class="text-muted" th:if="${pedido.valorDesconto != null and pedido.valorDesconto.signum() > 0}"
                                   th:text="${'desconto ' + pedido.percentualDesconto + '% (R$ ' + pedido.valorDesconto + ')'}"></small>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                            <small class="d-block text-muted" th:if="${pedido.justificativaCancelamento != null}"
                                   th:text="${'Motivo: ' + pedido.justificativaCancelamento}"></small>
                        </td>
                        <td>
                            <small th:text="${pedido.registradoPor}"></small><br>
                            <small th:text="${#temporals.format(pedido.dataEntrada, 'dd/MM/yyyy HH:mm')}"></small>
                        </td>
                        <td>
                            <small th:text="${pedido.responsavelSaida}"></small><br>
                            <small th:text="${#temporals.format(pedido.dataSaida, 'dd/MM/yyyy HH:mm')}"></small>
                        </td>
                        <td style="min-width: 260px;">
                            <!-- As permissões são verificadas no backend (SecurityConfig e PedidoService) -->
                            <form th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-flex gap-1 mb-1">
                                <select name="status" class="form-select form-select-sm">
                                    <option th:each="s : ${statusPedido}" th:if="${s.name() != 'CANCELADO'}"
                                            th:value="${s}" th:text="${s}"></option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Status</button>
                            </form>
                            <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="d-flex gap-1 mb-1">
                                <input type="number" name="percentual" step="0.01" min="0.01" max="20"
                                       class="form-control form-control-sm" placeholder="% desconto" required>
                                <button type="submit" class="btn btn-sm btn-outline-warning">Desconto</button>
                            </form>
                            <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post" class="d-flex gap-1">
                                <input type="text" name="justificativa" class="form-control form-control-sm"
                                       placeholder="Justificativa" required>
                                <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
