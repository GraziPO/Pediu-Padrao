<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm" style="max-width: 700px;">
        <div class="card-body p-4">

            <!-- Não há campos de preço ou total: o servidor calcula a partir do cadastro de produtos -->
            <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">

                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-medium">Cliente</label>
                    <select id="clienteId" class="form-select" th:field="*{clienteId}" required>
                        <option value="">Selecione um cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                </div>

                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th style="width: 130px;">Quantidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item, stat : *{itens}">
                            <td>
                                <select class="form-select" th:field="*{itens[__${stat.index}__].produtoId}">
                                    <option value="">—</option>
                                    <option th:each="p : ${produtos}" th:value="${p.id}"
                                            th:text="${p.nome + ' (R$ ' + p.preco + ')'}"></option>
                                </select>
                            </td>
                            <td>
                                <input type="number" min="0" class="form-control" required
                                       th:field="*{itens[__${stat.index}__].quantidade}"/>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Registrar Pedido
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
