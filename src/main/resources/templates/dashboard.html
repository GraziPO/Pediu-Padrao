<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-speedometer2 me-2 text-primary"></i>Dashboard
        </h2>
        <div class="d-flex align-items-center gap-2">
            <small class="text-muted" id="dashAtualizacao"></small>
            <button type="button" class="btn btn-outline-primary" id="dashAtualizar">
                <i class="bi bi-arrow-clockwise me-1"></i> Atualizar
            </button>
        </div>
    </div>

    <!-- RF05 - Filtros de consulta -->
    <form class="card shadow-sm mb-4" id="dashFiltros">
        <div class="card-body row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label for="dashPeriodo" class="form-label small mb-1">Período</label>
                <select id="dashPeriodo" class="form-select form-select-sm">
                    <option value="0">Hoje</option>
                    <option value="6" selected>Últimos 7 dias</option>
                    <option value="29">Últimos 30 dias</option>
                    <option value="">Personalizado</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="dashInicio" class="form-label small mb-1">De</label>
                <input type="date" id="dashInicio" class="form-control form-control-sm">
            </div>
            <div class="col-6 col-md-2">
                <label for="dashFim" class="form-label small mb-1">Até</label>
                <input type="date" id="dashFim" class="form-control form-control-sm">
            </div>
            <div class="col-6 col-md-2">
                <label for="dashStatus" class="form-label small mb-1">Status</label>
                <select id="dashStatus" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="s : ${statusPedido}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="dashTipo" class="form-label small mb-1">Tipo de produto</label>
                <select id="dashTipo" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="t : ${tiposProduto}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-primary flex-fill">Filtrar</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="dashLimpar">Limpar</button>
            </div>
        </div>
    </form>

    <!-- RF07 - Tratamento de erro -->
    <div class="alert alert-danger d-none" role="alert" id="dashErro">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span></span>
    </div>

    <!-- RF01 - Indicadores gerais -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small"><i class="bi bi-cash-coin me-1"></i>Faturamento</div>
                <div class="fs-4 fw-bold" id="kpiFaturamento">—</div>
                <small id="kpiFaturamentoVar"></small>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small"><i class="bi bi-bag me-1"></i>Pedidos</div>
                <div class="fs-4 fw-bold" id="kpiPedidos">—</div>
                <small id="kpiPedidosVar"></small>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small"><i class="bi bi-receipt me-1"></i>Ticket médio</div>
                <div class="fs-4 fw-bold" id="kpiTicket">—</div>
                <small id="kpiTicketVar"></small>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <div class="text-muted small"><i class="bi bi-x-circle me-1"></i>Cancelamentos</div>
                <div class="fs-4 fw-bold" id="kpiCancelamento">—</div>
                <small class="text-muted" id="kpiCancelados"></small>
            </div></div>
        </div>
    </div>

    <!-- RF02 - Análise de vendas -->
    <div class="row g-3 mb-4">
        <div class="col-lg-8">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Vendas por dia</span>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Métrica do gráfico">
                        <button type="button" class="btn btn-outline-secondary active" data-metrica="faturamento">Faturamento</button>
                        <button type="button" class="btn btn-outline-secondary" data-metrica="pedidos">Pedidos</button>
                    </div>
                </div>
                <div class="card-body"><div style="position: relative; height: 280px;"><canvas id="graficoDias"></canvas></div></div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">Pedidos por horário</div>
                <div class="card-body"><div style="position: relative; height: 280px;"><canvas id="graficoHoras"></canvas></div></div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <!-- RF03 - Situação dos pedidos -->
        <div class="col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white fw-semibold">Situação dos pedidos</div>
                <div class="card-body">
                    <div style="position: relative; height: 220px;"><canvas id="graficoStatus"></canvas></div>
                    <table class="table table-sm mt-3 mb-0">
                        <tbody id="tabelaStatus"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- RF04 - Produtos mais vendidos -->
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Produtos mais vendidos</span>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Ordenar ranking">
                        <button type="button" class="btn btn-outline-secondary active" data-ordem="quantidade">Quantidade</button>
                        <button type="button" class="btn btn-outline-secondary" data-ordem="faturamento">Faturamento</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-3">#</th>
                                <th>Produto</th>
                                <th>Tipo</th>
                                <th class="text-end">Qtd.</th>
                                <th class="text-end pe-3">Faturamento</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutos"></tbody>
                    </table>
                </div>
                <div class="card-body border-top">
                    <div class="small fw-semibold mb-2">Faturamento por tipo de produto</div>
                    <div style="position: relative; height: 160px;"><canvas id="graficoTipos"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <!-- RF03 - Últimos pedidos do período -->
    <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">Últimos pedidos do período</div>
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Entrada</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaPedidos"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script>
    (function () {
        const API = '/api/dashboard';
        const ATUALIZAR_A_CADA_MS = 60000;
        const CORES_STATUS = {
            RECEBIDO: '#6c757d', EM_PREPARACAO: '#ffc107', PRONTO: '#0dcaf0', SAIU_PARA_ENTREGA: '#0d6efd',
            RETIRADO: '#6610f2', FINALIZADO: '#198754', CANCELADO: '#dc3545'
        };
        // Mesmas cores de badge da tela de Pedidos
        const BADGE_STATUS = { FINALIZADO: 'bg-success', CANCELADO: 'bg-danger', EM_PREPARACAO: 'bg-warning text-dark' };

        const el = id => document.getElementById(id);
        const moeda = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        const numero = v => Number(v || 0).toLocaleString('pt-BR');
        const textoSeguro = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const isoLocal = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

        let metrica = 'faturamento';
        let ordem = 'quantidade';
        let vendasDia = [];
        const graficos = {};

        // ---------- Filtros (RF05) ----------
        function aplicarPeriodo() {
            const dias = el('dashPeriodo').value;
            if (dias === '') return;
            const fim = new Date();
            const inicio = new Date();
            inicio.setDate(fim.getDate() - Number(dias));
            el('dashInicio').value = isoLocal(inicio);
            el('dashFim').value = isoLocal(fim);
        }

        function parametros(extra) {
            const p = new URLSearchParams();
            if (el('dashInicio').value) p.set('dataInicio', el('dashInicio').value);
            if (el('dashFim').value) p.set('dataFim', el('dashFim').value);
            if (el('dashStatus').value) p.set('status', el('dashStatus').value);
            if (el('dashTipo').value) p.set('tipo', el('dashTipo').value);
            Object.entries(extra || {}).forEach(([k, v]) => p.set(k, v));
            return p.toString();
        }

        // ---------- Integração com a API (RF06) ----------
        async function buscar(caminho, extra) {
            const resposta = await fetch(API + caminho + '?' + parametros(extra), { headers: { 'Accept': 'application/json' } });
            if (resposta.redirected || resposta.status === 401) throw new Error('Sua sessão expirou. Entre novamente.');
            if (resposta.status === 403) throw new Error('Seu perfil não tem acesso ao dashboard.');
            if (!resposta.ok) throw new Error((await resposta.text()) || 'Erro ' + resposta.status + ' ao consultar a API.');
            return resposta.json();
        }

        // ---------- Atualização e tratamento (RF07) ----------
        async function carregar() {
            const botao = el('dashAtualizar');
            botao.disabled = true;
            botao.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Carregando';
            try {
                const [resumo, dias, horas, status, produtos, tipos, pedidos] = await Promise.all([
                    buscar('/resumo'),
                    buscar('/vendas-por-dia'),
                    buscar('/vendas-por-hora'),
                    buscar('/status-pedidos'),
                    buscar('/produtos-mais-vendidos', { limite: 5, ordenarPor: ordem }),
                    buscar('/vendas-por-tipo'),
                    buscar('/pedidos-recentes', { limite: 10 })
                ]);
                el('dashErro').classList.add('d-none');
                vendasDia = dias;
                mostrarResumo(resumo);
                mostrarGraficoDias();
                mostrarGraficoHoras(horas);
                mostrarStatus(status);
                mostrarProdutos(produtos);
                mostrarTipos(tipos);
                mostrarPedidos(pedidos);
                el('dashAtualizacao').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch (erro) {
                el('dashErro').querySelector('span').textContent = 'Não foi possível carregar o dashboard: ' + erro.message;
                el('dashErro').classList.remove('d-none');
            } finally {
                botao.disabled = false;
                botao.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i> Atualizar';
            }
        }

        // ---------- RF01 ----------
        function variacao(idEl, atual, anterior) {
            const alvo = el(idEl);
            if (!Number(anterior)) {
                alvo.className = 'text-muted';
                alvo.textContent = 'sem dados no período anterior';
                return;
            }
            const pct = (Number(atual) - Number(anterior)) / Number(anterior) * 100;
            alvo.className = pct >= 0 ? 'text-success' : 'text-danger';
            alvo.textContent = (pct >= 0 ? '▲ ' : '▼ ') + Math.abs(pct).toFixed(1).replace('.', ',') + '% vs período anterior';
        }

        function mostrarResumo(r) {
            el('kpiFaturamento').textContent = moeda(r.faturamento);
            el('kpiPedidos').textContent = numero(r.totalPedidos);
            el('kpiTicket').textContent = moeda(r.ticketMedio);
            el('kpiCancelamento').textContent = Number(r.taxaCancelamento).toFixed(1).replace('.', ',') + '%';
            el('kpiCancelados').textContent = numero(r.pedidosCancelados) + ' pedido(s) cancelado(s)';
            variacao('kpiFaturamentoVar', r.faturamento, r.periodoAnterior.faturamento);
            variacao('kpiPedidosVar', r.totalPedidos, r.periodoAnterior.totalPedidos);
            variacao('kpiTicketVar', r.ticketMedio, r.periodoAnterior.ticketMedio);
        }

        // ---------- RF02 ----------
        function desenhar(id, config) {
            if (graficos[id]) graficos[id].destroy();
            graficos[id] = new Chart(el(id), config);
        }

        function mostrarGraficoDias() {
            const ehFaturamento = metrica === 'faturamento';
            desenhar('graficoDias', {
                type: vendasDia.length === 1 ? 'bar' : 'line',
                data: {
                    labels: vendasDia.map(d => d.data.split('-').reverse().slice(0, 2).join('/')),
                    datasets: [{
                        label: ehFaturamento ? 'Faturamento' : 'Pedidos',
                        data: vendasDia.map(d => ehFaturamento ? d.faturamento : d.pedidos),
                        borderColor: '#0d6efd', backgroundColor: 'rgba(13,110,253,.15)', fill: true, tension: .3
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ehFaturamento ? moeda(c.parsed.y) : c.parsed.y + ' pedido(s)' } } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function mostrarGraficoHoras(horas) {
            const comVenda = horas.filter(h => h.pedidos > 0).map(h => h.hora);
            const de = comVenda.length ? Math.min(...comVenda) : 18;
            const ate = comVenda.length ? Math.max(...comVenda) : 23;
            const faixa = horas.filter(h => h.hora >= de && h.hora <= ate);
            desenhar('graficoHoras', {
                type: 'bar',
                data: { labels: faixa.map(h => h.hora + 'h'), datasets: [{ label: 'Pedidos', data: faixa.map(h => h.pedidos), backgroundColor: '#0d6efd' }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
            });
        }

        // ---------- RF03 ----------
        function mostrarStatus(lista) {
            const comPedidos = lista.filter(s => s.quantidade > 0);
            desenhar('graficoStatus', {
                type: 'doughnut',
                data: {
                    labels: comPedidos.map(s => s.status),
                    datasets: [{ data: comPedidos.map(s => s.quantidade), backgroundColor: comPedidos.map(s => CORES_STATUS[s.status] || '#adb5bd') }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
            el('tabelaStatus').innerHTML = lista.map(s =>
                '<tr><td><span class="d-inline-block rounded me-2" style="width:10px;height:10px;background:' + (CORES_STATUS[s.status] || '#adb5bd') + '"></span>' + s.status + '</td>' +
                '<td class="text-end fw-semibold">' + numero(s.quantidade) + '</td>' +
                '<td class="text-end text-muted">' + Number(s.percentual).toFixed(0) + '%</td></tr>').join('');
        }

        function mostrarPedidos(pedidos) {
            if (!pedidos.length) {
                el('tabelaPedidos').innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5"><i class="bi bi-inbox fs-3 d-block mb-2"></i>Nenhum pedido no período.</td></tr>';
                return;
            }
            el('tabelaPedidos').innerHTML = pedidos.map(p => {
                const entrada = new Date(p.dataEntrada).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                return '<tr><td class="ps-4 text-muted">' + textoSeguro(p.id) + '</td><td>' + entrada + '</td><td>' + textoSeguro(p.clienteNome) + '</td>' +
                    '<td>' + p.quantidadeItens + '</td><td>' + moeda(p.valorTotal) + '</td>' +
                    '<td><span class="badge ' + (BADGE_STATUS[p.status] || 'bg-secondary') + '">' + textoSeguro(p.status) + '</span></td></tr>';
            }).join('');
        }

        // ---------- RF04 ----------
        function mostrarProdutos(produtos) {
            if (!produtos.length) {
                el('tabelaProdutos').innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Nenhuma venda no período.</td></tr>';
                return;
            }
            el('tabelaProdutos').innerHTML = produtos.map((p, i) =>
                '<tr><td class="ps-3 text-muted">' + (i + 1) + '</td><td>' + textoSeguro(p.nome) + '</td><td class="text-muted">' + textoSeguro(p.tipo) + '</td>' +
                '<td class="text-end">' + numero(p.quantidade) + '</td><td class="text-end pe-3">' + moeda(p.faturamento) + '</td></tr>').join('');
        }

        function mostrarTipos(tipos) {
            desenhar('graficoTipos', {
                type: 'bar',
                data: { labels: tipos.map(t => t.tipo), datasets: [{ label: 'Faturamento', data: tipos.map(t => t.faturamento), backgroundColor: '#0d6efd' }] },
                options: {
                    indexAxis: 'y', maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => moeda(c.parsed.x) } } },
                    scales: { x: { beginAtZero: true } }
                }
            });
        }

        // ---------- Eventos ----------
        el('dashPeriodo').addEventListener('change', aplicarPeriodo);
        ['dashInicio', 'dashFim'].forEach(id => el(id).addEventListener('change', () => { el('dashPeriodo').value = ''; }));
        el('dashFiltros').addEventListener('submit', e => { e.preventDefault(); carregar(); });
        el('dashLimpar').addEventListener('click', () => {
            el('dashPeriodo').value = '6';
            el('dashStatus').value = '';
            el('dashTipo').value = '';
            aplicarPeriodo();
            carregar();
        });
        el('dashAtualizar').addEventListener('click', carregar);
        document.querySelectorAll('[data-metrica]').forEach(b => b.addEventListener('click', () => {
            metrica = b.dataset.metrica;
            document.querySelectorAll('[data-metrica]').forEach(x => x.classList.toggle('active', x === b));
            mostrarGraficoDias();
        }));
        document.querySelectorAll('[data-ordem]').forEach(b => b.addEventListener('click', async () => {
            ordem = b.dataset.ordem;
            document.querySelectorAll('[data-ordem]').forEach(x => x.classList.toggle('active', x === b));
            try { mostrarProdutos(await buscar('/produtos-mais-vendidos', { limite: 5, ordenarPor: ordem })); } catch (e) { carregar(); }
        }));

        aplicarPeriodo();
        carregar();
        setInterval(() => { if (!document.hidden) carregar(); }, ATUALIZAR_A_CADA_MS);
    })();
    </script>

</div>

</body>
</html>
